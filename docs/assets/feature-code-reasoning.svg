<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#7C5CFC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C5CFC" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .badge-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #A78BFA; }
    .card-sub { font-family: 'Inter', sans-serif; font-size: 14px; fill: #94A3B8; line-height: 1.6; }
    .code-text { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 13px; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Ambient Light Halo -->
  <circle cx="550" cy="225" r="160" fill="#7C5CFC" opacity="0.06" />

  <!-- Left Header Content -->
  <g transform="translate(50, 60)">
    <rect width="170" height="28" rx="14" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.3)" stroke-width="1" />
    <text x="85" y="18" class="badge-text" text-anchor="middle">CODE REASONING ENGINE</text>

    <text x="0" y="80" font-family="'Outfit', sans-serif" font-weight="800" font-size="32" fill="#F8FAFC">Code Analysis</text>
    <text x="0" y="120" font-family="'Outfit', sans-serif" font-weight="800" font-size="32" fill="#A78BFA">&amp; Walkthroughs</text>

    <text x="0" y="170" class="card-sub">In-depth code explanations,</text>
    <text x="0" y="195" class="card-sub">algorithmic walkthroughs,</text>
    <text x="0" y="220" class="card-sub">and syntax highlighting.</text>
  </g>

  <!-- Right Visual: Code Editor Card -->
  <g transform="translate(420, 75)" filter="url(#glow)">
    <rect width="330" height="290" rx="16" fill="#06080D" stroke="rgba(124,92,252,0.35)" stroke-width="1.5" />

    <!-- Window Top Header -->
    <rect width="330" height="40" rx="16" fill="#141720" />
    <circle cx="20" cy="20" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="36" cy="20" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="52" cy="20" r="5" fill="#22C55E" opacity="0.8" />
    <text x="165" y="24" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">binary_search.py</text>

    <!-- Code Block Content -->
    <g transform="translate(20, 60)">
      <text x="0" y="18" class="code-text" fill="#EC4899">def <tspan fill="#38BDF8">binary_search</tspan><tspan fill="#CBD5E1">(arr, target):</tspan></text>
      <text x="16" y="42" class="code-text" fill="#CBD5E1">low, high = <tspan fill="#F59E0B">0</tspan>, <tspan fill="#38BDF8">len</tspan>(arr) - <tspan fill="#F59E0B">1</tspan></text>
      <text x="16" y="66" class="code-text" fill="#EC4899">while <tspan fill="#CBD5E1">low &lt;= high:</tspan></text>
      <text x="32" y="90" class="code-text" fill="#CBD5E1">mid = (low + high) // <tspan fill="#F59E0B">2</tspan></text>
      <text x="32" y="114" class="code-text" fill="#EC4899">if <tspan fill="#CBD5E1">arr[mid] == target:</tspan></text>
      <text x="48" y="138" class="code-text" fill="#EC4899">return <tspan fill="#A78BFA">mid</tspan></text>
      <text x="32" y="162" class="code-text" fill="#EC4899">elif <tspan fill="#CBD5E1">arr[mid] &lt; target:</tspan></text>
      <text x="48" y="186" class="code-text" fill="#CBD5E1">low = mid + <tspan fill="#F59E0B">1</tspan></text>
    </g>

    <!-- AI Complexity Box -->
    <g transform="translate(180, 200)">
      <rect width="130" height="70" rx="10" fill="#1C2130" stroke="#7C5CFC" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#A78BFA">COMPLEXITY</text>
      <text x="12" y="46" font-family="monospace" font-size="13" font-weight="700" fill="#22C55E">Time: O(log N)</text>
      <text x="12" y="62" font-family="monospace" font-size="11" fill="#94A3B8">Space: O(1)</text>
    </g>
  </g>
</svg>
