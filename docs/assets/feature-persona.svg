<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C5CFC" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C5CFC" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .card-title { font-family: 'Outfit', 'Inter', sans-serif; font-weight: 700; font-size: 18px; fill: #F8FAFC; }
    .card-sub { font-family: 'Inter', sans-serif; font-size: 13px; fill: #94A3B8; }
    .badge-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #A78BFA; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Ambient Light Halos -->
  <circle cx="400" cy="225" r="180" fill="#7C5CFC" opacity="0.06" />

  <!-- Title Badge -->
  <g transform="translate(40, 40)">
    <rect width="140" height="28" rx="14" fill="rgba(124,92,252,0.12)" stroke="rgba(124,92,252,0.3)" stroke-width="1" />
    <text x="70" y="18" class="badge-text" text-anchor="middle">PERSONA ENGINE</text>
  </g>
  <text x="40" y="105" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" fill="#F8FAFC">Adaptive Learning Modes</text>

  <!-- 3 Persona Cards Grid -->
  <!-- Card 1: Student Mode -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <rect width="220" height="240" rx="16" fill="#1C2130" stroke="rgba(124,92,252,0.3)" stroke-width="1.5" />
    <circle cx="110" cy="70" r="32" fill="rgba(124,92,252,0.15)" />
    <!-- Student Icon -->
    <path d="M 110 50 L 82 65 L 110 80 L 138 65 Z M 82 77 L 110 92 L 138 77" stroke="#7C5CFC" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="110" y="135" class="card-title" text-anchor="middle">Student Mode</text>
    <text x="110" y="165" class="card-sub" text-anchor="middle">Simplified analogies,</text>
    <text x="110" y="185" class="card-sub" text-anchor="middle">step-by-step guides,</text>
    <text x="110" y="205" class="card-sub" text-anchor="middle">and interactive quizzes.</text>
  </g>

  <!-- Card 2: Teacher Mode (Center Highlight) -->
  <g transform="translate(290, 140)" filter="url(#shadow)">
    <rect width="220" height="240" rx="16" fill="#181D2A" stroke="url(#violetGrad)" stroke-width="2" />
    <circle cx="110" cy="70" r="32" fill="url(#violetGrad)" opacity="0.2" />
    <!-- Teacher Icon -->
    <path d="M 96 58 L 124 58 M 96 68 L 124 68 M 96 78 L 114 78 M 124 78 A 3 3 0 1 0 124 72 A 3 3 0 1 0 124 78 Z" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <text x="110" y="135" class="card-title" text-anchor="middle">Teacher Mode</text>
    <text x="110" y="165" class="card-sub" text-anchor="middle">Curriculum plans,</text>
    <text x="110" y="185" class="card-sub" text-anchor="middle">rubrics, assessment</text>
    <text x="110" y="205" class="card-sub" text-anchor="middle">keys &amp; socratic prompts.</text>
  </g>

  <!-- Card 3: Developer Mode -->
  <g transform="translate(540, 140)" filter="url(#shadow)">
    <rect width="220" height="240" rx="16" fill="#1C2130" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
    <circle cx="110" cy="70" r="32" fill="rgba(56,189,248,0.15)" />
    <!-- Developer Icon -->
    <path d="M 98 62 L 90 70 L 98 78 M 122 62 L 130 70 L 122 78 M 114 58 L 106 82" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="110" y="135" class="card-title" text-anchor="middle">Developer Mode</text>
    <text x="110" y="165" class="card-sub" text-anchor="middle">Algorithmic analysis,</text>
    <text x="110" y="185" class="card-sub" text-anchor="middle">refactoring ideas,</text>
    <text x="110" y="205" class="card-sub" text-anchor="middle">&amp; complexity breakdowns.</text>
  </g>
</svg>
