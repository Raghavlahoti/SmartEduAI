<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.4)" />
      <stop offset="100%" stop-color="rgba(56,189,248,0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .badge-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #38BDF8; }
    .card-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px; fill: #F8FAFC; }
    .card-sub { font-family: 'Inter', sans-serif; font-size: 14px; fill: #94A3B8; line-height: 1.6; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="450" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Ambient Light Halo -->
  <circle cx="550" cy="225" r="160" fill="#38BDF8" opacity="0.06" />

  <!-- Left Header Content -->
  <g transform="translate(50, 60)">
    <rect width="170" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
    <text x="85" y="18" class="badge-text" text-anchor="middle">OCR &amp; PDF EXTRACTION</text>

    <text x="0" y="80" font-family="'Outfit', sans-serif" font-weight="800" font-size="32" fill="#F8FAFC">Document</text>
    <text x="0" y="120" font-family="'Outfit', sans-serif" font-weight="800" font-size="32" fill="#38BDF8">Intelligence</text>

    <text x="0" y="170" class="card-sub">Extract text from uploaded PDFs</text>
    <text x="0" y="195" class="card-sub">and image files via on-device</text>
    <text x="0" y="220" class="card-sub">Tesseract OCR and PDF.js.</text>
  </g>

  <!-- Right Visual: PDF & Image Scanner Illustration -->
  <g transform="translate(420, 80)" filter="url(#glow)">
    <!-- Document Card -->
    <rect width="320" height="280" rx="16" fill="#1C2130" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />

    <!-- File Top Banner -->
    <rect width="320" height="44" rx="16" fill="#181D2A" />
    <circle cx="24" cy="22" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="22" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="64" cy="22" r="6" fill="#22C55E" opacity="0.8" />
    <text x="160" y="27" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">research-paper.pdf</text>

    <!-- Document Wireframe Lines -->
    <line x1="30" y1="75" x2="290" y2="75" stroke="#64748B" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <line x1="30" y1="95" x2="230" y2="95" stroke="#64748B" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <line x1="30" y1="115" x2="270" y2="115" stroke="#64748B" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Image OCR Box -->
    <rect x="30" y="140" width="120" height="100" rx="10" fill="#141720" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 45 210 L 75 175 L 95 195 L 125 160 L 135 210 Z" fill="rgba(56,189,248,0.2)" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="60" cy="165" r="8" fill="#F59E0B" opacity="0.8" />

    <!-- AI Extracted Text Result Lines -->
    <line x1="170" y1="155" x2="290" y2="155" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="170" y1="175" x2="260" y2="175" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" />
    <line x1="170" y1="195" x2="280" y2="195" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="170" y1="215" x2="240" y2="215" stroke="#64748B" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Laser Scanner Beam -->
    <polygon points="0,110 320,110 320,135 0,135" fill="url(#scannerGrad)" />
    <line x1="0" y1="110" x2="320" y2="110" stroke="#38BDF8" stroke-width="2.5" />
  </g>
</svg>
