<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="epGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="epGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: #09090E; }
    .mark-primary { fill: url(#epGrad); }
    .mark-secondary { fill: #FFFFFF; opacity: 0.95; }
    .mark-accent { fill: #38BDF8; }
  </style>

  <!-- Dark Background Canvas for high visibility -->
  <rect class="bg" width="512" height="512" rx="112" />

  <!-- Symbol: The Pilot Spark (Navigation + Intelligence + Growth) -->
  <g filter="url(#epGlow)" transform="translate(0, 0)">
    <!-- Upward Growth Arrow & Compass Quadrant (Primary Wing) -->
    <path class="mark-primary" d="
      M 256 96
      C 272 176, 336 240, 416 256
      C 336 272, 272 336, 256 416
      C 240 336, 176 272, 96 256
      C 176 240, 240 176, 256 96
      Z
    " />

    <!-- Intersecting Precision North-East Pilot Vector (Growth & Forward Trajectory) -->
    <path class="mark-secondary" d="
      M 256 160
      L 312 216
      L 352 256
      L 312 296
      L 256 352
      L 276 296
      L 332 256
      L 276 216
      Z
    " opacity="0.3" />

    <!-- Center Core Synapse Node -->
    <circle cx="256" cy="256" r="28" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="14" fill="#7C5CFC" />
  </g>
</svg>
