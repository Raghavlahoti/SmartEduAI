<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(124, 92, 252, 0.4)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7C5CFC" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Light Cone -->
  <polygon points="140,240 260,240 230,80 170,80" fill="url(#beamGrad)" />

  <!-- Base Grid Platform -->
  <ellipse cx="200" cy="240" rx="120" ry="18" fill="#141720" opacity="0.9" />
  <ellipse cx="200" cy="240" rx="120" ry="18" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Geometric Brain Synapse Network -->
  <g filter="url(#glow)">
    <!-- Connection Vectors -->
    <path d="M 200 80 L 150 110 L 140 160 L 180 190 L 200 170 L 220 190 L 260 160 L 250 110 Z" fill="none" stroke="url(#brainGrad)" stroke-width="2" />
    <line x1="200" y1="80" x2="200" y2="170" stroke="url(#brainGrad)" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="150" y1="110" x2="250" y2="110" stroke="url(#brainGrad)" stroke-width="1.5" />
    <line x1="140" y1="160" x2="260" y2="160" stroke="url(#brainGrad)" stroke-width="1.5" />
    <line x1="150" y1="110" x2="200" y2="170" stroke="url(#brainGrad)" stroke-width="1.5" />
    <line x1="250" y1="110" x2="200" y2="170" stroke="url(#brainGrad)" stroke-width="1.5" />

    <!-- Synapse Nodes -->
    <circle cx="200" cy="80" r="7" fill="#FFFFFF" />
    <circle cx="150" cy="110" r="6" fill="#A78BFA" />
    <circle cx="250" cy="110" r="6" fill="#38BDF8" />
    <circle cx="140" cy="160" r="5" fill="#7C5CFC" />
    <circle cx="260" cy="160" r="5" fill="#A78BFA" />
    <circle cx="180" cy="190" r="6" fill="#38BDF8" />
    <circle cx="220" cy="190" r="6" fill="#7C5CFC" />
    <circle cx="200" cy="170" r="8" fill="#FFFFFF" />
  </g>

  <!-- Thought Spark Wave Particles -->
  <path d="M 120 70 Q 140 50 160 65" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 280 70 Q 260 50 240 65" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <circle cx="120" cy="65" r="3" fill="#A78BFA" />
  <circle cx="280" cy="65" r="3" fill="#38BDF8" />

  <!-- Code/Data Bits floating -->
  <text x="110" y="130" font-family="monospace" font-size="11" fill="#64748B" opacity="0.6">{ }</text>
  <text x="275" y="130" font-family="monospace" font-size="11" fill="#64748B" opacity="0.6">01</text>
  <text x="115" y="180" font-family="monospace" font-size="11" fill="#64748B" opacity="0.6">f(x)</text>
  <text x="270" y="180" font-family="monospace" font-size="11" fill="#64748B" opacity="0.6">&lt;/&gt;</text>
</svg>
