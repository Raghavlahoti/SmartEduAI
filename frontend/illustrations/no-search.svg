<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="searchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D2A" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(124, 92, 252, 0.25)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C5CFC" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="190" cy="135" r="90" fill="#7C5CFC" opacity="0.06" />

  <!-- Base Grid Platform -->
  <ellipse cx="200" cy="225" rx="130" ry="22" fill="#141720" opacity="0.9" />
  <ellipse cx="200" cy="225" rx="130" ry="22" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Empty Document Wireframe Grid -->
  <g opacity="0.4" transform="translate(100, 75)">
    <rect width="80" height="95" rx="10" fill="#1C2130" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="15" y1="24" x2="65" y2="24" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="44" x2="50" y2="44" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="64" x2="58" y2="64" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Magnifying Glass with Zero Match Motif -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M 235 175 L 290 230" stroke="url(#rimGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 235 175 L 290 230" stroke="#0F1117" stroke-width="6" stroke-linecap="round" />

    <!-- Outer Rim -->
    <circle cx="185" cy="125" r="58" fill="url(#searchBg)" stroke="url(#rimGrad)" stroke-width="6" />
    
    <!-- Lens Reflection -->
    <circle cx="185" cy="125" r="52" fill="url(#lensGrad)" />
    <path d="M 150 110 A 42 42 0 0 1 200 80" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Zero / Not Found Symbol Inside Lens -->
    <circle cx="185" cy="125" r="20" fill="none" stroke="#64748B" stroke-width="3" opacity="0.6" />
    <line x1="171" y1="139" x2="199" y2="111" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Question / Floating Particles -->
  <circle cx="110" cy="170" r="3" fill="#38BDF8" opacity="0.7" />
  <circle cx="310" cy="100" r="4" fill="#A78BFA" opacity="0.6" />
  <circle cx="280" cy="70" r="2.5" fill="#7C5CFC" opacity="0.8" />
  <text x="320" y="150" font-family="sans-serif" font-weight="700" font-size="20" fill="#64748B" opacity="0.3">?</text>
</svg>
