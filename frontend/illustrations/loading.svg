<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ring1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C5CFC" />
    </linearGradient>
    <linearGradient id="ring2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7C5CFC" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .rot-cw { transform-origin: 200px 140px; animation: spinClockwise 8s linear infinite; }
    .rot-ccw { transform-origin: 200px 140px; animation: spinCounter 5s linear infinite; }
    .pulse-node { transform-origin: 200px 140px; animation: pulseCore 2.5s ease-in-out infinite; }
  </style>

  <!-- Ambient Glow -->
  <circle cx="200" cy="140" r="100" fill="#7C5CFC" opacity="0.08" />

  <!-- Base Grid Platform -->
  <ellipse cx="200" cy="235" rx="120" ry="20" fill="#141720" opacity="0.8" />
  <ellipse cx="200" cy="235" rx="120" ry="20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Outer Orbiting Ring -->
  <g class="rot-cw">
    <circle cx="200" cy="140" r="65" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3" stroke-dasharray="80 40 20 40" />
    <circle cx="265" cy="140" r="7" fill="url(#ring1Grad)" filter="url(#glow)" />
    <circle cx="135" cy="140" r="4" fill="#38BDF8" />
  </g>

  <!-- Inner Counter-Spin Ring -->
  <g class="rot-ccw">
    <circle cx="200" cy="140" r="45" fill="none" stroke="url(#ring2Grad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="140 100" />
    <circle cx="200" cy="95" r="6" fill="#A78BFA" filter="url(#glow)" />
  </g>

  <!-- Central Glowing AI Locus -->
  <g class="pulse-node" filter="url(#glow)">
    <circle cx="200" cy="140" r="22" fill="#1C2130" stroke="#7C5CFC" stroke-width="2" />
    <circle cx="200" cy="140" r="12" fill="url(#ring1Grad)" />
    <circle cx="200" cy="140" r="5" fill="#FFFFFF" />
  </g>

  <!-- Loading Bar Base -->
  <rect x="130" y="228" width="140" height="6" rx="3" fill="#1C2130" />
  <rect x="130" y="228" width="85" height="6" rx="3" fill="url(#ring1Grad)" filter="url(#glow)" />
</svg>
