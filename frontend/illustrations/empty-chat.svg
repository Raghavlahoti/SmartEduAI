<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C5CFC" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C5CFC" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="200" cy="150" r="110" fill="#7C5CFC" opacity="0.06" />

  <!-- Base Grid Platform -->
  <ellipse cx="200" cy="220" rx="140" ry="24" fill="#181D2A" opacity="0.8" />
  <ellipse cx="200" cy="220" rx="140" ry="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Background Chat Bubble (Left) -->
  <rect x="90" y="80" width="120" height="70" rx="16" fill="#1C2130" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <line x1="110" y1="105" x2="180" y2="105" stroke="#64748B" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <line x1="110" y1="125" x2="150" y2="125" stroke="#64748B" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Foreground Chat Bubble with AI Spark (Right) -->
  <g filter="url(#glow)">
    <rect x="180" y="110" width="130" height="80" rx="18" fill="url(#bgGrad)" stroke="#7C5CFC" stroke-width="2" />
    <path d="M 210 190 L 210 205 L 225 190 Z" fill="#0F1117" stroke="#7C5CFC" stroke-width="2" />
    <rect x="208" y="188" width="20" height="4" fill="#0F1117" />
    
    <!-- Skeleton Content Lines -->
    <line x1="205" y1="138" x2="270" y2="138" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" />
    <line x1="205" y1="158" x2="245" y2="158" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Central AI Pilot Spark -->
  <g transform="translate(190, 70)" filter="url(#glow)">
    <path fill="url(#primaryGrad)" d="M 20 0 C 22 12, 28 18, 40 20 C 28 22, 22 28, 20 40 C 18 28, 12 22, 0 20 C 12 18, 18 12, 20 0 Z" />
    <circle cx="20" cy="20" r="4" fill="#FFFFFF" />
  </g>

  <!-- Decorative Orbiting Dots & Sparkles -->
  <circle cx="110" cy="65" r="3" fill="#38BDF8" opacity="0.8" />
  <circle cx="310" cy="95" r="4" fill="#A78BFA" opacity="0.6" />
  <circle cx="330" cy="180" r="2.5" fill="#7C5CFC" opacity="0.7" />
  <path d="M 80 180 L 84 184 M 84 180 L 80 184" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
</svg>
