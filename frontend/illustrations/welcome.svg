<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="welcomeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0F1117" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="40%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2130" />
      <stop offset="100%" stop-color="#181D2A" />
    </linearGradient>
    <filter id="welcomeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#7C5CFC" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Sunburst Glow -->
  <circle cx="200" cy="120" r="115" fill="#7C5CFC" opacity="0.08" />

  <!-- Base Grid Platform -->
  <ellipse cx="200" cy="245" rx="145" ry="24" fill="#141720" opacity="0.9" />
  <ellipse cx="200" cy="245" rx="145" ry="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Persona Cards (Student, Teacher, Developer) Floating Below Beacon -->
  <!-- Left Card: Student -->
  <g transform="translate(75, 155) rotate(-8)">
    <rect width="70" height="85" rx="12" fill="url(#cardGrad1)" stroke="rgba(124,92,252,0.3)" stroke-width="1.5" />
    <circle cx="35" cy="32" r="14" fill="rgba(124,92,252,0.15)" />
    <path d="M 28 32 C 28 26, 42 26, 42 32 Z" fill="#7C5CFC" />
    <line x1="20" y1="58" x2="50" y2="58" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="68" x2="40" y2="68" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Right Card: Developer -->
  <g transform="translate(255, 155) rotate(8)">
    <rect width="70" height="85" rx="12" fill="url(#cardGrad1)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5" />
    <circle cx="35" cy="32" r="14" fill="rgba(56,189,248,0.15)" />
    <path d="M 27 28 L 21 32 L 27 36 M 43 28 L 49 32 L 43 36" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="20" y1="58" x2="50" y2="58" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="68" x2="35" y2="68" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Central Persona Card: Teacher/Primary -->
  <g transform="translate(155, 140)">
    <rect width="90" height="100" rx="14" fill="url(#welcomeBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <circle cx="45" cy="38" r="18" fill="rgba(167,139,250,0.15)" />
    <circle cx="45" cy="34" r="7" fill="#A78BFA" />
    <path d="M 32 50 C 32 42, 58 42, 58 50 Z" fill="#A78BFA" />
    <line x1="25" y1="70" x2="65" y2="70" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" />
    <line x1="25" y1="82" x2="50" y2="82" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Central EduPilot Beacon / Pilot Spark Rising -->
  <g transform="translate(160, 40)" filter="url(#welcomeGlow)">
    <path fill="url(#sparkGrad)" d="
      M 40 0
      C 44 26, 62 44, 80 48
      C 62 52, 44 70, 40 96
      C 36 70, 18 52, 0 48
      C 18 44, 36 26, 40 0
      Z
    " />
    <path fill="#FFFFFF" opacity="0.3" d="
      M 40 0
      C 44 26, 62 44, 80 48
      L 40 48
      Z
    " />
    <circle cx="40" cy="48" r="9" fill="#FFFFFF" />
    <circle cx="40" cy="48" r="4" fill="#7C5CFC" />
  </g>

  <!-- Floating Sparkles & Light Orbs -->
  <circle cx="110" cy="50" r="3" fill="#38BDF8" opacity="0.8" />
  <circle cx="290" cy="55" r="4" fill="#A78BFA" opacity="0.8" />
  <circle cx="330" cy="120" r="2.5" fill="#7C5CFC" opacity="0.7" />
  <circle cx="70" cy="115" r="3" fill="#38BDF8" opacity="0.6" />
</svg>
