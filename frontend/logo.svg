<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="logoMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="40%" stop-color="#7C5CFC" />
      <stop offset="80%" stop-color="#5D3CF2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Wordmark Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- AI Badge Gradient -->
    <linearGradient id="aiBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#7C5CFC" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .brand-text {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 64px;
      letter-spacing: -0.03em;
      fill: url(#textGrad);
    }
    .badge-text {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.04em;
      fill: #FFFFFF;
    }
  </style>

  <!-- Group 1: Emblem Mark (The Pilot Spark) -->
  <g transform="translate(24, 24)" filter="url(#logoGlow)">
    <!-- Main 4-point Compass Spark -->
    <path fill="url(#logoMarkGrad)" d="
      M 76 12
      C 82 52, 112 82, 152 88
      C 112 94, 82 124, 76 164
      C 70 124, 40 94, 0 88
      C 40 82, 70 52, 76 12
      Z
    " />

    <!-- Trajectory Wing Overlay -->
    <path fill="#FFFFFF" opacity="0.3" d="
      M 76 12
      C 82 52, 112 82, 152 88
      L 76 88
      Z
    " />

    <!-- Core Synapse Node -->
    <circle cx="76" cy="88" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" />
    <circle cx="76" cy="88" r="8" fill="#FFFFFF" />
    <circle cx="76" cy="88" r="4" fill="#7C5CFC" />

    <!-- Directional Trajectory Dots -->
    <circle cx="120" cy="44" r="3" fill="#38BDF8" opacity="0.9" />
    <circle cx="136" cy="28" r="2" fill="#A78BFA" opacity="0.7" />
  </g>

  <!-- Group 2: Wordmark ("EduPilot") -->
  <text x="210" y="112" class="brand-text">EduPilot</text>

  <!-- Group 3: AI Badge Accent -->
  <g transform="translate(488, 62)">
    <rect width="64" height="38" rx="10" fill="url(#aiBadgeGrad)" />
    <rect width="64" height="38" rx="10" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
    <text x="32" y="26" class="badge-text" text-anchor="middle">AI</text>
  </g>
</svg>
