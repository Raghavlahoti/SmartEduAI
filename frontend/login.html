<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPilot AI — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #09090b;
            --bg-card: #18181b;
            --border-subtle: #27272a;
            --accent-emerald: #10b981;
            --accent-indigo: #6366f1;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --error-color: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 32px 24px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-badge {
            font-size: 10px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-emerald), var(--accent-indigo));
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            width: 100%;
            font-size: 14px;
            background-color: #09090b;
            color: #fff;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-emerald);
        }

        button.primary-btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            color: white;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            font-weight: 600;
            margin-top: 8px;
        }

        button.primary-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
        }

        .auth-toggle-link {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-toggle-link a {
            color: var(--accent-emerald);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-toggle-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 14px;
            display: none;
            padding: 10px;
            background-color: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .error-message.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-container" id="login-container">
        <a href="landing.html" class="brand-logo" style="text-decoration:none;color:inherit;" title="Back to EduPilot AI Landing Page">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            <span class="brand-title">EduPilot <span class="brand-badge">AI</span></span>
        </a>
        <h2>Welcome Back</h2>
        <div class="subtitle">Your Intelligent Learning Companion</div>

        <div class="form-group">
            <label for="login-username">Username or Email</label>
            <input type="text" id="login-username" placeholder="student@example.com" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button id="login-button" class="primary-btn">Sign In</button>
        <div class="auth-toggle-link">
            <a href="#" id="register-from-login">Don't have an account? Sign Up</a>
        </div>
        <div id="login-error" class="error-message"></div>
    </div>

    <div class="auth-container" id="register-container" style="display: none;">
        <div class="brand-logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            <span class="brand-title">EduPilot <span class="brand-badge">AI</span></span>
        </div>
        <h2>Create Account</h2>
        <div class="subtitle">Join EduPilot AI — Your Intelligent Learning Companion</div>

        <div class="form-group">
            <label for="register-username">Username or Email</label>
            <input type="text" id="register-username" placeholder="student@example.com" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" placeholder="••••••••" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="register-confirm-password">Confirm Password</label>
            <input type="password" id="register-confirm-password" placeholder="••••••••" autocomplete="new-password">
        </div>

        <button id="register-button" class="primary-btn">Register</button>
        <div class="auth-toggle-link">
            <a href="#" id="login-from-register">Already have an account? Sign In</a>
        </div>
        <div id="register-error" class="error-message"></div>
    </div>

    <script>
        const loginContainer = document.getElementById("login-container");
        const registerContainer = document.getElementById("register-container");
        const registerLinkFromLogin = document.getElementById("register-from-login");
        const loginLinkFromRegister = document.getElementById("login-from-register");
        const loginButton = document.getElementById("login-button");
        const registerButton = document.getElementById("register-button");
        const loginUsernameInput = document.getElementById("login-username");
        const loginPasswordInput = document.getElementById("login-password");
        const registerUsernameInput = document.getElementById("register-username");
        const registerPasswordInput = document.getElementById("register-password");
        const registerConfirmPasswordInput = document.getElementById("register-confirm-password");
        const loginError = document.getElementById("login-error");
        const registerError = document.getElementById("register-error");

        function showError(errorMessageElement, message) {
            errorMessageElement.textContent = message;
            errorMessageElement.classList.add("show");
        }

        function hideError(errorMessageElement) {
            errorMessageElement.classList.remove("show");
            errorMessageElement.textContent = "";
        }

        registerLinkFromLogin.addEventListener("click", (event) => {
            event.preventDefault();
            loginContainer.style.display = "none";
            registerContainer.style.display = "block";
            hideError(loginError);
        });

        loginLinkFromRegister.addEventListener("click", (event) => {
            event.preventDefault();
            registerContainer.style.display = "none";
            loginContainer.style.display = "block";
            hideError(registerError);
        });

        loginButton.addEventListener("click", () => {
            const username = loginUsernameInput.value.trim();
            const password = loginPasswordInput.value.trim();
            hideError(loginError);

            if (!username) return showError(loginError, "Please enter your username.");
            if (!password) return showError(loginError, "Please enter your password.");

            localStorage.setItem("userSession", JSON.stringify({ username, timestamp: Date.now() }));
            window.location.href = "index.html";
        });

        registerButton.addEventListener("click", () => {
            const username = registerUsernameInput.value.trim();
            const password = registerPasswordInput.value.trim();
            const confirmPassword = registerConfirmPasswordInput.value.trim();
            hideError(registerError);

            if (!username) return showError(registerError, "Please enter a username.");
            if (!password) return showError(registerError, "Please enter a password.");
            if (password !== confirmPassword) return showError(registerError, "Passwords do not match.");

            localStorage.setItem("userSession", JSON.stringify({ username, timestamp: Date.now() }));
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
